name: Publish

# Tag-triggered release. Push a version tag (e.g. `git tag v0.11.0 && git push
# origin v0.11.0`) and this workflow runs the full test gate, then publishes to
# npm WITH provenance (OIDC-signed supply-chain attestation — only possible from
# CI, never from a local machine), and cuts a GitHub Release.
#
# One-time setup: add an npm *Automation* access token as the repo secret
# NPM_TOKEN (Settings → Secrets and variables → Actions). Automation tokens
# bypass 2FA, which interactive `npm publish` on a local machine cannot.
on:
  push:
    tags:
      - "v*"

# Read-only default; the publish job re-declares the write scopes it needs below.
permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # mint the OIDC token npm provenance requires
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      # Fail fast if the tag and package.json disagree — prevents publishing a
      # version that doesn't match the tag that triggered this run.
      - name: Verify tag matches package.json + server.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          SJ="$(node -p "require('./server.json').version")"
          SJP="$(node -p "require('./server.json').packages[0].version")"
          echo "tag=$TAG package.json=$PKG server.json=$SJ/$SJP"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          if [ "$TAG" != "$SJ" ] || [ "$TAG" != "$SJP" ]; then
            echo "::error::Tag v$TAG does not match server.json version ($SJ / packages[0] $SJP) — bump server.json in lockstep"
            exit 1
          fi

      # Same gate as CI — never publish a red build.
      - name: Run tests
        run: npm test

      - name: Smoke (--hubs on self)
        run: node agentmap.mjs --hubs

      - name: Validate pack manifest
        run: npm pack --dry-run

      - name: Publish to npm (with provenance)
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes

      # List the stdio MCP server in the official MCP Registry. GitHub OIDC (the
      # id-token: write permission above) authorizes the io.github.raymondchins/*
      # namespace — no secret needed. Runs LAST so a registry hiccup never blocks
      # the npm publish or the GitHub Release.
      #
      # continue-on-error is what actually delivers that "never blocks" promise:
      # ordering alone still fails the job (and so the whole release run) when the
      # registry is down, even though npm publish and the Release already landed.
      # Re-running to clear the red would then hit EPUBLISHCONFLICT on npm publish.
      # -f makes curl fail loudly on an HTTP error instead of piping an HTML error
      # page into tar, which would otherwise surface as "not in gzip format".
      # Pinned + checksum-verified, to match the SHA-pinning policy every `uses:`
      # in this repo follows. `releases/latest` was the one unpinned executable in
      # either workflow, fetched and run with id-token: write in scope. A release
      # *tag* is mutable — assets can be re-uploaded under it — so the sha256 is
      # what actually pins the bytes; the tag alone would not reach parity.
      # Dependabot cannot see URLs inside a `run:` block, so bump VERSION and
      # SHA256 together by hand from the checksums asset
      # (registry_<version>_checksums.txt) at
      # https://github.com/modelcontextprotocol/registry/releases
      - name: Install mcp-publisher
        continue-on-error: true
        env:
          MCP_PUBLISHER_VERSION: v1.8.0
          MCP_PUBLISHER_SHA256: 1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf
        run: |
          set -euo pipefail
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          rm -f mcp-publisher.tar.gz

      - name: Publish to the MCP Registry (GitHub OIDC — no secret)
        continue-on-error: true
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish ./server.json
