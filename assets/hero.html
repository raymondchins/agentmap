<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
  agentmap README banner.

  Design width is 1200px on purpose. GitHub renders README images at roughly
  375px on a phone, so everything here is divided by ~3.2 on mobile. That sets a
  hard floor: nothing below ~34px in this file, or it becomes unreadable on a
  phone. Favour fewer elements at a larger size over more elements at a smaller one.
-->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1200px; height:800px;
    font-family:-apple-system, "SF Pro Display", "Helvetica Neue", Helvetica, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .frame {
    width:1200px; height:800px;
    background:
      radial-gradient(820px 420px at 12% -12%, rgba(46,224,168,.15), transparent 62%),
      radial-gradient(560px 320px at 98% 110%, rgba(46,224,168,.09), transparent 60%),
      #05100D;
    border:1px solid #16302a; border-radius:22px;
    padding:44px 52px; display:flex; flex-direction:column; overflow:hidden;
  }

  /* ---------- header ---------- */
  .head { display:flex; align-items:center; gap:18px; }
  .mark {
    width:64px; height:64px; border-radius:17px;
    background:linear-gradient(150deg,#34EBB0,#17B98A);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 32px rgba(46,224,168,.25); flex:0 0 auto;
  }
  .wordmark { font-size:56px; font-weight:800; letter-spacing:-2px; color:#F2FBF8; line-height:1; }
  .badges { margin-left:auto; display:flex; gap:11px; }
  .b {
    font-size:26px; font-weight:600; color:#7E948E; letter-spacing:-.2px;
    background:#0A1714; border:1px solid #1B332C; border-radius:9px; padding:8px 14px;
  }

  /* ---------- headline ---------- */
  .headline {
    margin-top:44px;
    font-size:82px; font-weight:800; letter-spacing:-3.4px;
    line-height:1.04; color:#F2FBF8;
  }
  .headline b { color:#2EE0A8; font-weight:800; text-shadow:0 0 44px rgba(46,224,168,.4); }
  .sub {
    margin-top:18px; font-size:34px; color:#8FA39E; letter-spacing:-.5px;
  }

  /* ---------- bars ---------- */
  .bars { margin-top:auto; }
  .bar { margin-bottom:24px; }
  .barlabel { display:flex; align-items:baseline; margin-bottom:11px; }
  .who { font-size:34px; color:#A6BDB7; letter-spacing:-.5px; }
  .who b { color:#F2FBF8; font-weight:700; }
  .tok {
    margin-left:auto; font-family:"SF Mono", Menlo, monospace;
    font-size:38px; font-weight:600; letter-spacing:-1px; color:#E4756A;
  }
  .tok.good { color:#2EE0A8; }
  .track { height:44px; border-radius:11px; background:#0B1512; overflow:hidden; }
  .fill { height:100%; border-radius:11px; }
  .fill.bad  { width:100%; background:linear-gradient(90deg,#7A3129,#C4574A); }
  .fill.good { width:1.73%; background:linear-gradient(90deg,#17B98A,#48F5BC);
               box-shadow:0 0 26px rgba(46,224,168,.6); }

  /* ---------- footer ---------- */
  .foot { margin-top:30px; display:flex; align-items:center; }
  .cmd {
    font-family:"SF Mono", Menlo, monospace; font-size:32px;
    color:#CFE6DF; background:#0A1714; border:1px solid #1B332C;
    padding:14px 22px; border-radius:12px; letter-spacing:-.8px;
  }
  .cmd i { color:#2EE0A8; font-style:normal; }
  .works { margin-left:auto; font-size:27px; color:#63776F; letter-spacing:-.3px; }
</style>
</head>
<body>
<div class="frame">

  <div class="head">
    <div class="mark">
      <svg width="38" height="38" viewBox="0 0 24 24" fill="none">
        <path d="M8.6 3.4 3.2 5.7v14.9l5.4-2.3 6.8 2.3 5.4-2.3V3.4l-5.4 2.3-6.8-2.3Z"
              fill="#052B20" stroke="#04140F" stroke-width="1.3" stroke-linejoin="round"/>
        <path d="M8.6 3.4v14.9M15.4 5.7v14.9" stroke="#7FFFD4" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="12" cy="11" r="1.9" fill="#04140F"/>
      </svg>
    </div>
    <div class="wordmark">agentmap</div>
    <div class="badges">
      <div class="b">1 dep</div>
      <div class="b">100% local</div>
      <div class="b">MIT</div>
    </div>
  </div>

  <div class="headline"><b>98% fewer tokens</b><br>to find your code.</div>
  <div class="sub">7 real agent tasks, one 154-file repo. Same answers.</div>

  <div class="bars">
    <div class="bar">
      <div class="barlabel">
        <div class="who">Agent greps and reads files</div>
        <div class="tok">257,778</div>
      </div>
      <div class="track"><div class="fill bad"></div></div>
    </div>

    <div class="bar">
      <div class="barlabel">
        <div class="who">Agent asks <b>agentmap</b></div>
        <div class="tok good">4,451</div>
      </div>
      <div class="track"><div class="fill good"></div></div>
    </div>
  </div>

  <div class="foot">
    <div class="cmd">npx <i>@raymondchins/agentmap</i></div>
    <div class="works">Claude Code · Cursor · Codex · Copilot</div>
  </div>

</div>
</body>
</html>
